<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Workspace - Smoke Test</title>
    <style>
        body { font-family: Inter, system-ui, sans-serif; padding: 20px; background: #f9fafb; color: #111827; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .test-item { padding: 12px 14px; margin: 8px 0; border-left: 4px solid #2563eb; background: #f8fafc; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
        .test-passed { border-left-color: #10b981; }
        .test-failed { border-left-color: #ef4444; }
        .btn { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 4px; font-size: 14px; }
        .btn:hover { background: #1d4ed8; }
        iframe { width: 100%; height: 600px; border: 2px solid #e5e7eb; border-radius: 8px; margin-top: 16px; background: #0b0f1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hermes Workspace - Smoke Test</h1>
        <p>The standalone workspace is now a React + Vite app. Build artefacts live in <code>static/nixon-workspace/</code>.</p>

        <h2>File presence</h2>
        <div id="file-tests"></div>

        <h2>Open it</h2>
        <button class="btn" onclick="open1()">Open new workspace</button>
        <button class="btn" onclick="openLegacy()">Open legacy URL (redirects)</button>
        <button class="btn" onclick="openMobile()">Mobile size preview</button>

        <h2>Live preview</h2>
        <iframe src="static/nixon-workspace/index.html" title="Hermes Workspace Preview"></iframe>
    </div>

    <script>
        // Files we expect to exist after `cd webui && npm install && npm run build`.
        const expected = [
            'static/nixon-workspace/index.html',
            'static/nixon-workspace/sprites/dev.png',
            'static/nixon-workspace/sprites/manager.png',
            'static/nixon-workspace/sprites/ops.png',
            'static/nixon-workspace/sprites/research.png',
        ];
        const list = document.getElementById('file-tests');
        expected.forEach((f) => {
            const el = document.createElement('div');
            el.className = 'test-item';
            el.textContent = '... ' + f;
            list.appendChild(el);
            fetch(f, { method: 'HEAD' })
                .then((r) => {
                    el.className = 'test-item ' + (r.ok ? 'test-passed' : 'test-failed');
                    el.textContent = (r.ok ? 'OK   ' : 'MISS ') + f;
                })
                .catch(() => {
                    el.className = 'test-item test-failed';
                    el.textContent = 'MISS ' + f;
                });
        });

        function open1() { window.open('static/nixon-workspace/index.html', '_blank'); }
        function openLegacy() { window.open('static/nixon-workspace.html', '_blank'); }
        function openMobile() { window.open('static/nixon-workspace/index.html', '_blank', 'width=400,height=800'); }
    </script>
</body>
</html>
