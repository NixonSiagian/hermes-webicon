<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
        user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Hermes Workspace</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #0b0f1a;
      font-family: 'Courier New', Courier, monospace;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    /* ── TOPBAR ── */
    #hud-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      padding-top: env(safe-area-inset-top, 0);
      z-index: 9999;
      background: rgba(11, 15, 26, 0.96);
      border-bottom: 1px solid rgba(0, 229, 204, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 14px;
      padding-right: 14px;
      gap: 8px;
    }
    #hud-topbar-title {
      font-size: 13px; font-weight: 700;
      color: #00e5cc; letter-spacing: 2px;
      text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
    }
    #agent-count {
      font-size: 10px; color: rgba(0,229,204,0.75);
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; flex: 1; text-align: center;
    }
    #exit-btn {
      flex-shrink: 0; padding: 5px 12px;
      background: rgba(0,229,204,0.08);
      border: 1px solid rgba(0,229,204,0.3);
      border-radius: 5px; color: #00e5cc;
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s;
      touch-action: manipulation;
    }
    #exit-btn:active { background: rgba(0,229,204,0.22); }

    /* ── CANVAS CONTAINER ── */
    #workspace-container {
      position: fixed;
      top: calc(44px + env(safe-area-inset-top, 0px));
      left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: #0a0e17;
      touch-action: none;
    }
    #workspace-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    /* ── BOTTOM LABEL ── */
    #room-label {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      color: #7899aa; font-size: 9px;
      background: rgba(10,14,23,0.88);
      padding: 4px 9px; border-radius: 4px;
      border: 1px solid rgba(0,229,204,0.15);
      pointer-events: none; z-index: 100;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="hud-topbar">
    <span id="hud-topbar-title">⚡ Hermes</span>
    <span id="agent-count">Starting...</span>
    <button id="exit-btn" onclick="exitWorkspace()">✕ Exit</button>
  </div>

  <div id="workspace-container"></div>

  <div id="room-label">Hermes 2D Office · Live Sim</div>

  <!-- PixiJS 7 from jsdelivr.net (allowed by server CSP) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>

  <!-- Main simulation — self-contained, never blocks -->
  <script src="pixi-workspace.js"></script>

  <script>
    function exitWorkspace() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'workspace-close' }, '*');
      } else {
        window.history.back();
      }
    }
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
</body>
</html>
