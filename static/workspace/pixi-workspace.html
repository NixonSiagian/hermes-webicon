<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes 2D Office Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0e17;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        #workspace-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #workspace-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #workspace-hud {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #00e5cc;
            font-size: 11px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 4px rgba(0, 229, 204, 0.6);
            background: rgba(10, 14, 23, 0.92);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 204, 0.3);
        }

        #workspace-hud h1 {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 1.5px;
        }

        #workspace-hud p {
            opacity: 0.65;
            font-size: 9px;
        }

        #room-label {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: #aabbcc;
            font-size: 10px;
            background: rgba(10, 14, 23, 0.9);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 204, 0.2);
            pointer-events: none;
            z-index: 100;
        }

        #agent-count {
            position: fixed;
            top: 8px;
            right: 8px;
            color: #00e5cc;
            font-size: 10px;
            background: rgba(10, 14, 23, 0.9);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 204, 0.2);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="workspace-container"></div>

    <div id="workspace-hud">
        <h1>HERMES OFFICE SIM</h1>
        <p>Tile-Based 2D Simulation</p>
    </div>

    <div id="room-label">Initializing...</div>
    <div id="agent-count">Agents: ...</div>

    <!-- PixiJS 7.x CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>

    <!-- Tile-based 2D Office Simulation Renderer -->
    <script src="pixi-workspace.js"></script>
</body>
</html>
