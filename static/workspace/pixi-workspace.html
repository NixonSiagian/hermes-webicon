<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes 2D Workspace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f1a;
            font-family: 'Courier New', monospace;
        }

        #workspace-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #workspace-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #workspace-hud {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #00e5cc;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 6px rgba(0, 229, 204, 0.5);
            background: rgba(11, 15, 26, 0.8);
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 204, 0.2);
        }

        #workspace-hud h1 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        #workspace-hud p {
            opacity: 0.7;
            font-size: 10px;
        }

        #room-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: #ffffff;
            font-size: 11px;
            background: rgba(11, 15, 26, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 204, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        #agent-count {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #00e5cc;
            font-size: 11px;
            background: rgba(11, 15, 26, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 204, 0.3);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="workspace-container">
        <!-- PixiJS canvas renders here -->
    </div>

    <div id="workspace-hud">
        <h1>HERMES WORKSPACE</h1>
        <p>Tile-Based 2D Office</p>
    </div>

    <div id="room-label">Loading...</div>
    <div id="agent-count">Agents: ...</div>

    <!-- PixiJS 7.x CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>

    <!-- Tile-based Workspace Renderer -->
    <script src="pixi-workspace.js"></script>
</body>
</html>
